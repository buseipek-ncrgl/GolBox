<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Şehitkamil+ Yönetim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      window.addEventListener('error', function(event) {
        var errDiv = document.createElement('div');
        errDiv.style.position = 'fixed';
        errDiv.style.top = '0';
        errDiv.style.left = '0';
        errDiv.style.right = '0';
        errDiv.style.background = '#ef4444';
        errDiv.style.color = '#fff';
        errDiv.style.padding = '1.5rem';
        errDiv.style.fontFamily = 'monospace';
        errDiv.style.fontSize = '14px';
        errDiv.style.zIndex = '999999';
        errDiv.style.whiteSpace = 'pre-wrap';
        errDiv.innerHTML = '<strong>Hata Yakalandı:</strong><br/>' + event.message + '<br/>Dosya: ' + event.filename + ':' + event.lineno + ':' + event.colno + '<br/><br/>Hata Detayı: ' + (event.error ? event.error.stack : 'Stack Yok');
        document.body.appendChild(errDiv);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
